name: App Android Northing3D

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Compilar APK
        run: gradle -p android assembleDebug --stacktrace
      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Northing3D.apk
      - uses: actions/upload-artifact@v4
        with: { name: Northing3D-apk, path: Northing3D.apk }
      - name: Publicar en Releases (para descargar desde el celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Northing3D app v0.1.${{ github.run_number }}
          files: Northing3D.apk
          prerelease: true
